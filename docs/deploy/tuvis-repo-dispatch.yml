# 复制到 jarvislee90s-dot/tuvis 主仓：.github/workflows/notify-website.yml
# 作用（P20 扩展）：主仓发 release、或手册/日志/矩阵文档变更 → 通知网站仓自动重建部署。
# 前置：在 tuvis 仓配一个 fine-grained PAT secret（名为 SITE_DISPATCH_PAT）：
#   - 仓库权限只勾 jarvislee90s-dot/tuvis-website
#   - Permissions → Actions → Read and write
# 未配置 secret 时本 workflow 会红叉，但不影响网站仓的 24h 定时兜底——配置后即实时。
name: Notify website on release / docs change

on:
  release:
    types: [published]
  push:
    branches: [main]
    paths:
      - "docs/user-manual/**"
      - "CHANGELOG.md"
      - "CHANGELOG.en.md"
      - "docs/capabilities.json"

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Send repository_dispatch to tuvis-website
        continue-on-error: true # PAT 未配置时不让主仓 Actions 挂红
        # 注意：官方 actions 组织没有 repository-dispatch 这个 action（2026-10-13 核实）——
        # 社区标准实现是 peter-evans/repository-dispatch，入参 token/repository/event-type 同义
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.SITE_DISPATCH_PAT }}
          repository: jarvislee90s-dot/tuvis-website
          event-type: tuvis-docs-update
