name: Redeploy latest website release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "只允许重发最新稳定网站 tag，例如 v0.6.0"
        required: true
        type: string

permissions:
  contents: write
  actions: write

# 恢复编排不占用 Pages 部署锁；实际发布由 deploy.yml 的单 pending job 锁串行化。
concurrency:
  group: pages-recovery-orchestrator
  cancel-in-progress: false

jobs:
  redeploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
      - name: Validate requested release
        run: node scripts/validate-recovery-request.mjs
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
      - name: Create empty marker commit with the exact release tree
        id: marker
        run: node scripts/create-redeploy-marker.mjs
        # GITHUB_TOKEN cannot create refs whose tree contains workflow files,
        # on the git push path (issue #7) nor on the Git data API path
        # (POST /git/refs returns 403; empirically confirmed on run
        # 39978121538 — commit-object creation succeeds, ref creation is
        # gated). The orchestrator therefore needs a PAT with Contents and
        # Workflows read/write; it falls back to GITHUB_TOKEN so the failure
        # mode stays clean when the secret is not configured yet.
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          GH_TOKEN: ${{ secrets.RELEASE_RECOVERY_PAT || github.token }}
      - name: Dispatch the pinned release deployment
        id: dispatch
        run: |
          response=$(gh api --method POST --header "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/deploy.yml/dispatches" \
            -F "ref=${MARKER_BRANCH}" \
            -F "inputs[release_tag]=${RELEASE_TAG}" \
            -F "return_run_details=true")
          deploy_run_id=$(jq -r '.workflow_run_id // empty' <<< "$response")
          if [[ -z "$deploy_run_id" ]]; then
            echo "::error::GitHub did not return the deployment workflow run id"
            exit 1
          fi
          echo "deploy_run_id=$deploy_run_id" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.RELEASE_RECOVERY_PAT || github.token }}
          MARKER_BRANCH: ${{ steps.marker.outputs.branch }}
          RELEASE_TAG: ${{ inputs.release_tag }}
      - name: Wait for Pages deployment
        run: gh run watch "$DEPLOY_RUN_ID" --exit-status
        env:
          GH_TOKEN: ${{ secrets.RELEASE_RECOVERY_PAT || github.token }}
          DEPLOY_RUN_ID: ${{ steps.dispatch.outputs.deploy_run_id }}
      - name: Delete marker branch
        if: always() && steps.marker.outputs.branch != ''
        run: gh api --method DELETE "/repos/${GITHUB_REPOSITORY}/git/refs/heads/${MARKER_BRANCH}"
        env:
          GH_TOKEN: ${{ secrets.RELEASE_RECOVERY_PAT || github.token }}
          MARKER_BRANCH: ${{ steps.marker.outputs.branch }}
