# recovery-marker-protocol: v1
# 只发布正式稳定 tag。网站源码与文档都固定在同版本的两个仓库 tag 上。
name: Deploy to GitHub Pages

on:
  push:
    tags: ["v*"]
  # 仅接受由 redeploy-latest.yml 创建的同树 marker branch。
  workflow_dispatch:
    inputs:
      release_tag:
        description: "待恢复的最新正式网站 tag（仅由恢复 workflow 调用）"
        required: true
        type: string

permissions:
  contents: read

jobs:
  # 快速校验放在并发队列前。较旧的 push 事件会解析为当前最新稳定 tag。
  resolve:
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.target.outputs.release_tag }}
      should_deploy: ${{ steps.target.outputs.should_deploy }}
      recovery: ${{ steps.target.outputs.recovery }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
      - name: Fetch the event ref for immutable SHA checks
        run: git fetch origin "$GITHUB_REF" --no-tags --depth=2
      - name: Validate release event before enqueueing deployment
        id: target
        run: node scripts/resolve-deploy-target.mjs
        env:
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}

  # Single pending slot: a newer deployment replaces an older pending one.
  # Resolve again after acquiring the lock so a delayed old run always builds latest.
  deploy:
    needs: resolve
    if: needs.resolve.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: github-pages-production
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: event-tools
          fetch-depth: 0
      - name: Fetch the event ref for lock-time validation
        run: git fetch origin "$GITHUB_REF" --no-tags --depth=2
      - name: Resolve the latest release after acquiring the deployment lock
        id: locked_target
        run: node event-tools/scripts/resolve-deploy-target.mjs
        env:
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.locked_target.outputs.release_tag }}
          path: workflow-tools
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.locked_target.outputs.release_tag }}
          path: site
          fetch-depth: 0
      - name: Checkout matching Tuvis content tag
        run: |
          git clone --depth=1 --single-branch --branch "$TUVIS_RELEASE_REF" \
            https://github.com/jarvislee90s-dot/tuvis.git ../tuvis-source
          expected=$(git -C ../tuvis-source rev-parse "${TUVIS_RELEASE_REF}^{commit}")
          actual=$(git -C ../tuvis-source rev-parse HEAD)
          if [[ "$expected" != "$actual" ]]; then
            echo "::error::Tuvis checkout does not match $TUVIS_RELEASE_REF"
            exit 1
          fi
        working-directory: site
        env:
          TUVIS_RELEASE_REF: ${{ steps.locked_target.outputs.release_tag }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: site
      - run: pnpm test
        working-directory: site
      # 工作流与构建脚本来自本次目标 release；网站应用文件也来自同一 tag。
      - name: Apply pinned release content synchronizers
        run: cp ../workflow-tools/scripts/{split-changelog.mjs,sync-user-manual.mjs,release-policy.mjs} scripts/
        working-directory: site
      - run: pnpm build
        working-directory: site
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TUVIS_RELEASE_REF: ${{ steps.locked_target.outputs.release_tag }}
          TUVIS_RELEASE_SOURCE_DIR: ../tuvis-source
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist
      # A tag arriving during the build invalidates this artifact; its run will take the lock next.
      - name: Recheck latest release before deployment
        id: latest
        run: node workflow-tools/scripts/assert-latest-release.mjs "$RELEASE_TAG"
        env:
          RELEASE_TAG: ${{ steps.locked_target.outputs.release_tag }}
      - id: deployment
        if: steps.latest.outputs.is_latest == 'true'
        uses: actions/deploy-pages@v4
