# recovery-marker-protocol: v1
# 只发布正式稳定 tag。网站源码与文档都固定在同版本的两个仓库 tag 上。
# 托管自 2026-10 起为 Cloudflare Pages（自定义域名 tuvis.app）：构建流程不变，
# 仅发布目标由 GitHub Pages 换成 wrangler 直传（secrets：CLOUDFLARE_API_TOKEN /
# CLOUDFLARE_ACCOUNT_ID；首个 tag 自动建 Pages 项目 tuvis，域名在项目 Custom domains 绑定）。
name: Deploy to Cloudflare Pages

on:
  push:
    tags: ["v*"]
  # 仅接受由 redeploy-latest.yml 创建的同树 marker branch。
  workflow_dispatch:
    inputs:
      release_tag:
        description: "待恢复的最新正式网站 tag（仅由恢复 workflow 调用）"
        required: true
        type: string

permissions:
  contents: read

jobs:
  # 快速校验放在并发队列前。旧事件不改建另一 tag 的内容，改为排队发布当前最新 tag。
  resolve:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    outputs:
      release_tag: ${{ steps.target.outputs.release_tag }}
      should_deploy: ${{ steps.target.outputs.should_deploy }}
      recovery: ${{ steps.target.outputs.recovery }}
      reconcile_tag: ${{ steps.target.outputs.reconcile_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
      - name: Fetch the event ref for immutable SHA checks
        run: git fetch origin "$GITHUB_REF" --no-tags --depth=2
      - name: Validate release event before enqueueing deployment
        id: target
        run: node scripts/resolve-deploy-target.mjs
        env:
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
      - name: Queue a same-tree deployment for a newer tag
        if: steps.target.outputs.reconcile_tag != ''
        run: node scripts/dispatch-latest-redeploy.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          RECONCILE_TAG: ${{ steps.target.outputs.reconcile_tag }}

  # Single pending slot: a newer deployment replaces an older pending one.
  # A delayed old run queues a same-tree marker for latest; it never builds another tag under this event SHA.
  deploy:
    needs: resolve
    if: needs.resolve.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: github-pages-production
      cancel-in-progress: false
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: event-tools
          fetch-depth: 0
      - name: Fetch the event ref for lock-time validation
        run: git fetch origin "$GITHUB_REF" --no-tags --depth=2
        working-directory: event-tools
      - name: Resolve the latest release after acquiring the deployment lock
        id: locked_target
        run: node scripts/resolve-deploy-target.mjs
        working-directory: event-tools
        env:
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
      - name: Queue the latest tag if this event became stale while waiting
        if: steps.locked_target.outputs.reconcile_tag != ''
        run: node scripts/dispatch-latest-redeploy.mjs
        working-directory: event-tools
        env:
          GH_TOKEN: ${{ github.token }}
          RECONCILE_TAG: ${{ steps.locked_target.outputs.reconcile_tag }}
      - uses: actions/checkout@v4
        if: steps.locked_target.outputs.should_deploy == 'true'
        with:
          ref: ${{ steps.locked_target.outputs.release_tag }}
          path: workflow-tools
          fetch-depth: 0
      - uses: actions/checkout@v4
        if: steps.locked_target.outputs.should_deploy == 'true'
        with:
          ref: ${{ steps.locked_target.outputs.release_tag }}
          path: site
          fetch-depth: 0
      - name: Checkout matching Tuvis content tag
        if: steps.locked_target.outputs.should_deploy == 'true'
        run: |
          git clone --depth=1 --single-branch --branch "$TUVIS_RELEASE_REF" \
            https://github.com/jarvislee90s-dot/tuvis.git ../tuvis-source
          expected=$(git -C ../tuvis-source rev-parse "${TUVIS_RELEASE_REF}^{commit}")
          actual=$(git -C ../tuvis-source rev-parse HEAD)
          if [[ "$expected" != "$actual" ]]; then
            echo "::error::Tuvis checkout does not match $TUVIS_RELEASE_REF"
            exit 1
          fi
        working-directory: site
        env:
          TUVIS_RELEASE_REF: ${{ steps.locked_target.outputs.release_tag }}
      - uses: pnpm/action-setup@v4
        if: steps.locked_target.outputs.should_deploy == 'true'
        with:
          version: 10.20.0
      - uses: actions/setup-node@v4
        if: steps.locked_target.outputs.should_deploy == 'true'
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        if: steps.locked_target.outputs.should_deploy == 'true'
        working-directory: site
      - run: pnpm test
        if: steps.locked_target.outputs.should_deploy == 'true'
        working-directory: site
      # 工作流与构建脚本来自本次目标 release；网站应用文件也来自同一 tag。
      - name: Apply pinned release content synchronizers
        if: steps.locked_target.outputs.should_deploy == 'true'
        run: cp ../workflow-tools/scripts/{split-changelog.mjs,sync-user-manual.mjs,release-policy.mjs} scripts/
        working-directory: site
      - run: pnpm build
        if: steps.locked_target.outputs.should_deploy == 'true'
        working-directory: site
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TUVIS_RELEASE_REF: ${{ steps.locked_target.outputs.release_tag }}
          TUVIS_RELEASE_SOURCE_DIR: ../tuvis-source
      # A tag arriving during the build invalidates this deployment; its run will take the lock next.
      - name: Recheck latest release before deployment
        if: steps.locked_target.outputs.should_deploy == 'true'
        id: latest
        run: node scripts/assert-latest-release.mjs "$RELEASE_TAG"
        working-directory: workflow-tools
        env:
          RELEASE_TAG: ${{ steps.locked_target.outputs.release_tag }}
      - name: Queue a same-tree deployment if a newer tag arrived during the build
        if: steps.latest.outputs.is_latest == 'false' && steps.latest.outputs.latest_tag != ''
        run: node scripts/dispatch-latest-redeploy.mjs
        working-directory: workflow-tools
        env:
          GH_TOKEN: ${{ github.token }}
          RECONCILE_TAG: ${{ steps.latest.outputs.latest_tag }}
      - name: Deploy to Cloudflare Pages
        if: steps.locked_target.outputs.should_deploy == 'true' && steps.latest.outputs.is_latest == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site/dist --project-name=tuvis --branch=main
