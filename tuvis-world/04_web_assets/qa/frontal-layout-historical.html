<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>Tuvis World 素材摆放检查</title><style>
*{box-sizing:border-box}body{margin:0;background:#12232b;color:#f4ede0;font:16px system-ui}main{max-width:1200px;margin:auto;padding:24px}h1{font-size:24px}p{color:#c1d2d6;line-height:1.6}section{margin:24px 0}.stage{position:relative;width:100%;aspect-ratio:3/2;overflow:hidden;background:#182b33;border-radius:14px}.stage>img{width:100%;height:100%;display:block}.art{position:absolute;overflow:hidden}.art image{pointer-events:none}.caption{position:absolute;left:14px;bottom:14px;background:#12232bd9;border-radius:8px;padding:8px 12px;font-size:14px}.assembly{aspect-ratio:1100/720;background:radial-gradient(ellipse at 50% 45%,#344752,#121f28)}.tag{position:absolute;padding:4px 8px;border-radius:4px;background:#12232be0;color:#ffdd9c;font-size:12px;border:1px solid #f3b34c}.notice{border-left:3px solid #f3b34c;padding-left:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.grid h2{font-size:17px}a{color:#8dd9f0}</style><main><h1>兔维斯世界 · 素材摆放检查</h1><p>静态美术检查，非游戏实现。新图为候选素材：检查角色落点、动作替换与组装零件的布局。</p><section><h2>工坊与站立角色</h2><div class="stage" id="room"></div></section><div class="grid"><section><h2>椅子位置与坐姿</h2><div class="stage" id="sit"></div></section><section><h2>咖啡位置与持杯姿势</h2><div class="stage" id="coffee"></div></section></div><section><h2>组装模块归位布局</h2><p class="notice">独立生成零件不保证像素级接缝。归位反馈后切换完整成品图；下图仅检查外形与插槽位置。</p><div class="stage assembly" id="assembly"></div></section><section><h2>完成后使用完整装备图</h2><div class="stage assembly" id="complete"></div></section><p>所有图像由素材包内文件加载。没有生图、建模、云端 API 或游戏运行逻辑。</p></main><script>
(async()=>{const m=await(await fetch('../asset-manifest.json')).json(); const urls={};for(const [id,a] of Object.entries(m.assets)){const res=await fetch('../'+a.path);if(!res.ok)throw Error(a.path);urls[id]=URL.createObjectURL(await res.blob());}const asset=(id)=>m.assets[id];function art(el,id,rect,W,H,z=1){const a=asset(id),box=document.createElementNS('http://www.w3.org/2000/svg','svg');box.setAttribute('viewBox',a.viewBox.join(' '));box.setAttribute('preserveAspectRatio','xMidYMid meet');box.setAttribute('class','art');box.style.cssText='left:'+rect[0]/W*100+'%;top:'+rect[1]/H*100+'%;width:'+rect[2]/W*100+'%;height:'+rect[3]/H*100+'%;z-index:'+z;const im=document.createElementNS('http://www.w3.org/2000/svg','image');im.setAttribute('href',urls[id]);im.setAttribute('width',a.width);im.setAttribute('height',a.height);box.append(im);el.append(box);}
function room(id){const el=document.getElementById(id);const im=document.createElement('img');im.src=urls.room;el.append(im);return el;}
function standing(el,id,foot,height,anchor=[.5,.985]){const a=asset(id),w=height*a.viewBox[2]/a.viewBox[3];art(el,id,[foot[0]-anchor[0]*w,foot[1]-anchor[1]*height,w,height],1536,1024,2);}
const r=room('room');standing(r,'idle',m.scene.spawn,370,m.scene.actor.footAnchorInViewBox);for(const h of m.scene.hotspots){const t=document.createElement('span');t.className='tag';t.textContent=h.label;t.style.left=h.rect[0]/1536*100+'%';t.style.top=h.rect[1]/1024*100+'%';r.append(t);}const cap=document.createElement('div');cap.className='caption';cap.textContent=m.scene.uiCopy.help.join(' · ');r.append(cap);
const s=room('sit'),ap=m.scene.actionPlacements.sit,a=asset('sit'),w=ap.displayHeight*a.viewBox[2]/a.viewBox[3],ax=(ap.seatAnchorSource[0]-a.viewBox[0])/a.viewBox[2],ay=(ap.seatAnchorSource[1]-a.viewBox[1])/a.viewBox[3];art(s,'sit',[ap.seatPosition[0]-ax*w,ap.seatPosition[1]-ay*ap.displayHeight,w,ap.displayHeight],1536,1024,2);
const c=room('coffee');standing(c,'coffee',m.scene.actionPlacements.coffee.footPosition,m.scene.actionPlacements.coffee.displayHeight);
const e=document.getElementById('assembly');art(e,m.assembly.base.asset,m.assembly.base.rect,1100,720,1);for(const mod of m.assembly.modules){art(e,mod.asset,mod.targetRect,1100,720,mod.z);}
art(document.getElementById('complete'),'complete',m.assembly.complete.rect,1100,720,1);document.body.dataset.ready='true';})();</script></html>
